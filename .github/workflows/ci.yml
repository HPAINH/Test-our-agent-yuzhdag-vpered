name: ci

on:
  push:
    branches: [main, "feature/**", "task/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q
      - run: uv run python -m app.eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: smoke test
        run: |
          docker build -t smoke .
          docker run -d --name smoke -p 8000:8000 -e LLM_MODE=mock smoke
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && break; sleep 3; done
          curl -sf localhost:8000/api/v1/auth/users | grep -q cfo_a
