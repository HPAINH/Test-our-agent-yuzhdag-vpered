feature_phrases:
  CL_PRODUCT_LOA_MARK: у компании есть кредитные продукты
  CL_PRODUCT_LEA_MARK: компания финансирует основные средства через лизинг
  FACTORING_MARK: оборотный капитал частично финансируется факторингом
  CL_PRODUCT_DEP_MARK: у компании размещены депозиты
  CL_PRODUCT_GAR_MARK: компания использует банковские гарантии (контракты, госзакупки)
  CL_PRODUCT_ZPP_MARK: у компании зарплатный проект
  CL_PRODUCT_RKO_MARK: компания обслуживается в банке по РКО
  FTS_FLAG: компания ведёт внешнеэкономическую деятельность (страна по данным ФТС — {country})
  WORKERS: численность персонала — {workers}
  MAINOKVED_CODE: основной вид деятельности — «{okved_name}»
  REGION: регион обслуживания — {region}
  REVENUE_COMPANY: годовая выручка около {revenue_bn} млрд ₽
  GROUP_ID: компания входит в группу из {group_members} компаний
  COUNTERPARTY: крупный {cp_dir} ({cp_share}% {cp_flow} платежей) работает в отрасли «{cp_okved_name}»
  USER_INPUT: пользователь отметил фактор как важный для компании
  CONCENTRATION: на одного контрагента приходится {cp_share}% {cp_flow} платежей
disclaimer: Материал носит информационно-аналитический характер, подготовлен автоматически и не является индивидуальной инвестиционной
  рекомендацией, офертой или официальной позицией Альфа-Банка, кроме явно помеченных цитат аналитиков банка. Решения принимаются
  клиентом самостоятельно.
impact_scale:
  high:
    label: Высокое
    min_score: 70
    meaning: 'Затрагивает ключевой для компании фактор напрямую: через отрасль, регион или крупных контрагентов; событие уже
      произошло. Стоит обсудить на ближайшем финансовом комитете.'
  medium:
    label: Среднее
    min_score: 55
    meaning: Фактор значим для компании, но влияние косвенное или событие ещё не наступило (обсуждение, прогноз). Заложить
      в сценарии и отслеживать.
  low:
    label: Низкое
    min_score: 0
    meaning: Влияние возможно через общий экономический фон; срочных действий не требует.
