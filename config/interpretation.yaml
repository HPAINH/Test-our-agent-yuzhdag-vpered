feature_phrases:
  CL_PRODUCT_LOA_MARK: у компании есть кредитные продукты
  CL_PRODUCT_LEA_MARK: компания финансирует основные средства через лизинг
  FACTORING_MARK: оборотный капитал частично финансируется факторингом
  CL_PRODUCT_DEP_MARK: у компании размещены депозиты
  CL_PRODUCT_GAR_MARK: компания использует банковские гарантии (контракты, госзакупки)
  CL_PRODUCT_ZPP_MARK: у компании зарплатный проект
  CL_PRODUCT_RKO_MARK: компания обслуживается в банке по РКО
  FTS_FLAG: компания ведёт внешнеэкономическую деятельность (страна по данным ФТС — {country})
  WORKERS: численность персонала — {workers}
  MAINOKVED_CODE: основной вид деятельности — «{okved_name}»
  REGION: регион регистрации — {region}
  REVENUE_COMPANY: годовая выручка около {revenue_bn} млрд ₽
  GROUP_ID: компания входит в группу из {group_members} компаний
  COUNTERPARTY: ключевой {cp_dir} ({cp_share}% платежей) работает в отрасли «{cp_okved_name}»
  CONCENTRATION: на одного контрагента приходится {cp_share}% {cp_flow} платежей

factors:
  key_rate:
    object: стоимости долга
    dir: {up: ключевая ставка повышается, down: ключевая ставка снижается, flat: ключевая ставка сохраняется на высоком уровне}
    risk: "{dir}, поэтому стоимость заёмных денег для компании не снизится: процентные расходы и ставки по новому и рефинансируемому долгу останутся высокими"
    opportunity: "{dir}, поэтому доходность размещения свободной ликвидности остаётся высокой"
    mixed: "{dir}: долг остаётся дорогим, но и доходность размещения ликвидности высокая"
    opportunity_down: "{dir}: стоимость новых заимствований и рефинансирования может начать снижаться"
    risk_down: "{dir}: доходность размещения свободной ликвидности будет снижаться"
    action_opportunity_down: Подготовить план рефинансирования дорогого долга на момент снижения ставок
    action_risk_down: Зафиксировать текущую доходность депозитов на более длинный срок
    action_risk: Проверить долю кредитов с плавающей ставкой и график погашений на 6–12 месяцев; рассмотреть фиксацию ставки или перенос крупных заимствований
    action_opportunity: Пересмотреть политику размещения свободных средств и зафиксировать доходность на срок, пока ставка высокая
    product_risk: {code: refinancing, title: Рефинансирование и кредит с фиксированной ставкой, needs_feature: CL_PRODUCT_LOA_MARK}
    product_opportunity: {code: deposit, title: Депозит с фиксированной ставкой, unless_feature: CL_PRODUCT_DEP_MARK}
    horizon: 1-3m
  inflation:
    object: издержек
    dir: {up: инфляция ускоряется, down: инфляция замедляется, flat: инфляция держится на прежнем уровне}
    risk: "{dir}; это давит на себестоимость (сырьё, услуги, зарплаты) и повышает риск того, что ставка дольше останется высокой"
    opportunity: "{dir}; это снижает давление на издержки и приближает смягчение денежно-кредитной политики"
    mixed: "{dir}: растут и издержки, и номинальные цены реализации — важен баланс маржи"
    action_risk: Заложить в бюджет индексацию закупочных цен и зарплат; проверить условия индексации в договорах с покупателями
    action_opportunity: Использовать паузу в росте издержек для фиксации цен в долгосрочных закупочных контрактах
    horizon: 1-3m
  fx_usd:
    object: валютных расчётов
    dir: {up: рубль слабеет к доллару, down: рубль укрепляется к доллару, flat: курс доллара стабилен}
    risk: "{dir}; это меняет рублёвую стоимость валютных расчётов компании"
    opportunity: "{dir}; валютная выручка в пересчёте на рубли меняется в пользу компании"
    mixed: "{dir}; эффект зависит от баланса валютной выручки и валютных затрат"
    action_risk: Оценить открытую валютную позицию и рассмотреть хеджирование ближайших платежей
    action_opportunity: Зафиксировать курс по части будущей валютной выручки
    product_risk: {code: fx_hedge, title: Валютный форвард и хеджирование}
    product_opportunity: {code: fx_hedge, title: Валютный форвард и хеджирование}
    horizon: 0-1m
  fx_cny:
    object: расчётов в юанях
    dir: {up: рубль слабеет к юаню, down: рубль укрепляется к юаню, flat: курс юаня стабилен}
    risk: "{dir}; для компании с расчётами с Китаем меняется рублёвая стоимость контрактов"
    opportunity: "{dir}; выручка в юанях в пересчёте на рубли меняется в пользу компании"
    mixed: "{dir}; эффект зависит от того, чего у компании больше в юанях — выручки или закупок"
    action_risk: Сверить валюту контрактов с Китаем и зафиксировать курс по ближайшим платежам
    action_opportunity: Продать часть ожидаемой юаневой выручки по форварду
    product_risk: {code: fx_hedge, title: Валютный форвард в юанях}
    product_opportunity: {code: fx_hedge, title: Валютный форвард в юанях}
    horizon: 0-1m
  fx_eur:
    object: расчётов в евро
    dir: {up: рубль слабеет к евро, down: рубль укрепляется к евро, flat: курс евро стабилен}
    risk: "{dir}; это влияет на стоимость расчётов с европейскими контрагентами"
    opportunity: "{dir}; это улучшает рублёвую выручку по контрактам в евро"
    mixed: "{dir}; эффект зависит от структуры расчётов в евро"
    action_risk: Проверить валюту и сроки европейских контрактов
    action_opportunity: Зафиксировать курс по части будущей выручки в евро
    product_risk: {code: fx_hedge, title: Валютный форвард}
    horizon: 0-1m
  cmd_oil:
    object: топливных издержек
    dir: {up: нефть и топливо дорожают, down: нефть и топливо дешевеют, flat: цены на нефть стабильны}
    risk: "{dir}; это сказывается на транспортных и производственных издержках"
    opportunity: "{dir}; это поддерживает выручку компаний нефтяной цепочки"
    mixed: "{dir}; эффект зависит от того, где компания в цепочке — продаёт или потребляет топливо"
    action_risk: Пересчитать топливную составляющую в себестоимости и тарифах
    action_opportunity: Рассмотреть фиксацию цен реализации на ближайшие поставки
    risk_producer: "{dir}; это снижает выручку и маржу компаний нефтяной цепочки"
    opportunity_buyer: "{dir}; это снижает топливную составляющую издержек"
    action_risk_producer: Пересмотреть план продаж и капвложений с учётом цен
    action_opportunity_buyer: Зафиксировать текущие цены в контрактах на топливо
    horizon: 1-3m
  cmd_metals:
    object: выручки и маржи
    dir: {up: цены на металлы растут, down: цены на металлы снижаются, flat: цены на металлы стабильны}
    risk: "{dir}; это меняет стоимость закупок металлопродукции"
    opportunity: "{dir}; это влияет на выручку и маржу производителей и трейдеров металлов"
    mixed: "{dir}; для металлургической цепочки это одновременно цена продукции и цена сырья"
    action_risk: Обновить ценовые допущения бюджета закупок металла
    action_opportunity: Пересмотреть ценовую политику и график отгрузок с учётом конъюнктуры
    risk_producer: "{dir}; это давит на выручку и маржу компании и её покупателей-трейдеров"
    opportunity_buyer: "{dir}; закупки металлопродукции дешевеют"
    action_risk_producer: Пересчитать бюджет выручки при текущих ценах и проверить, где можно перераспределить экспорт и сократить издержки
    action_opportunity_buyer: Зафиксировать текущие цены в контрактах на металл на ближайшие поставки
    horizon: 1-3m
  cmd_coal:
    object: себестоимости
    dir: {up: уголь и энергоносители дорожают, down: уголь и энергоносители дешевеют, flat: цены на уголь стабильны}
    risk: "{dir}; это меняет энергетическую и сырьевую составляющую себестоимости"
    opportunity: "{dir}; это улучшает выручку производителей угля"
    mixed: "{dir}; эффект зависит от позиции компании в угольной цепочке"
    action_risk: Проверить условия долгосрочных контрактов на поставку угля и энергии
    action_opportunity: Зафиксировать цены в контрактах на ближайшие поставки
    risk_producer: "{dir}; это снижает выручку производителей угля"
    opportunity_buyer: "{dir}; энергетическая и сырьевая составляющая себестоимости снижается"
    action_risk_producer: Пересмотреть план отгрузок и цены реализации
    action_opportunity_buyer: Зафиксировать текущие цены в контрактах на уголь и энергию
    horizon: 1-3m
  cmd_construction:
    object: себестоимости строительства
    dir: {up: стройматериалы дорожают, down: стройматериалы дешевеют, flat: цены на стройматериалы стабильны}
    risk: "{dir}; это увеличивает себестоимость строительства и давит на маржу проектов"
    opportunity: "{dir}; это поддерживает выручку производителей стройматериалов"
    mixed: "{dir}; эффект зависит от позиции компании в строительной цепочке"
    risk_producer: "{dir}; это снижает выручку производителей стройматериалов"
    opportunity_buyer: "{dir}; это снижает себестоимость строительства"
    action_risk: Пересчитать сметы текущих проектов и зафиксировать цены с ключевыми поставщиками
    action_opportunity: Пересмотреть цены реализации и план отгрузок
    action_risk_producer: Пересмотреть план отгрузок и цены реализации
    action_opportunity_buyer: Зафиксировать текущие цены в контрактах на стройматериалы
    horizon: 1-3m
  cmd_gold:
    object: стоимости активов
    dir: {up: золото дорожает, down: золото дешевеет, flat: цены на золото стабильны}
    risk: "{dir}"
    opportunity: "{dir}; это поддерживает выручку золотодобычи"
    mixed: "{dir}"
    action_risk: Учесть динамику золота в оценке активов
    action_opportunity: Рассмотреть хеджирование цены будущих продаж
    risk_producer: "{dir}; это снижает выручку золотодобычи"
    opportunity_buyer: "{dir}"
    action_risk_producer: Рассмотреть хеджирование цены будущих продаж
    action_opportunity_buyer: Учесть динамику золота в оценке активов
    horizon: 1-3m
  cmd_agro:
    object: закупок сырья
    dir: {up: агросырьё дорожает, down: агросырьё дешевеет, flat: цены на агросырьё стабильны}
    risk: "{dir}; это меняет стоимость сырья для переработки"
    opportunity: "{dir}; это влияет на выручку производителей и экспортёров"
    mixed: "{dir}; эффект зависит от доли сырья в закупках и продажах"
    action_risk: Обновить план закупок сырья и рассмотреть закупку впрок
    action_opportunity: Спланировать продажи урожая с учётом ценовой конъюнктуры
    risk_producer: "{dir}; это снижает выручку производителей и экспортёров агросырья"
    opportunity_buyer: "{dir}; закупочные цены на сырьё и продукты у поставщиков снижаются"
    action_risk_producer: Спланировать продажи урожая и хранение с учётом цен
    action_opportunity_buyer: Пересмотреть закупочные цены с поставщиками и зафиксировать их на сезон
    horizon: 1-3m
  consumer_demand:
    object: продаж
    dir: {up: потребительский спрос растёт, down: потребительский спрос замедляется, flat: потребительский спрос стабилен}
    risk: "{dir}; это отражается на продажах и оборачиваемости запасов"
    opportunity: "{dir}; это поддерживает продажи и загрузку мощностей"
    mixed: "{dir}; эффект для компании зависит от ценового сегмента и ассортимента"
    action_risk: Пересмотреть план продаж и уровень товарных запасов на ближайший квартал
    action_opportunity: Подготовить запасы и маркетинг под сохранение спроса
    product_risk: {code: factoring, title: Факторинг для ускорения оборачиваемости, unless_feature: FACTORING_MARK}
    horizon: 1-3m
  real_estate:
    object: продаж и проектного финансирования
    dir: {up: условия для рынка жилья и ипотеки улучшаются, down: спрос на жильё и ипотеку снижается, flat: рынок жилья без существенных изменений}
    risk: "{dir}; это напрямую влияет на продажи и темпы реализации проектов"
    opportunity: "{dir}; это поддерживает продажи и денежный поток проектов"
    mixed: "{dir}; эффект зависит от доли ипотечных сделок в продажах"
    action_risk: Пересчитать график продаж и потребность в проектном финансировании
    action_opportunity: Ускорить вывод новых очередей в продажу
    horizon: 3-12m
  labor:
    object: фонда оплаты труда
    dir: {up: напряжённость на рынке труда растёт, down: рынок труда охлаждается, flat: ситуация на рынке труда не меняется}
    risk: "{dir}; это давит на фонд оплаты труда и сроки найма"
    opportunity: "{dir}; это облегчает найм и снижает давление на зарплаты"
    mixed: "{dir}"
    action_risk: Заложить индексацию зарплат и оценить риск оттока ключевых специалистов
    action_opportunity: Использовать момент для закрытия критичных вакансий
    product_risk: {code: payroll, title: Зарплатный проект, unless_feature: CL_PRODUCT_ZPP_MARK}
    horizon: 3-12m
  regulation:
    object: налоговой нагрузки и процессов
    dir: {up: регулирование и налоговая нагрузка ужесточаются, down: регулирование смягчается, flat: регуляторные условия меняются}
    risk: "{dir}; это затрагивает налоговые платежи, отчётность или условия работы отрасли"
    opportunity: "{dir}; это снижает регуляторную нагрузку"
    mixed: "{dir}; требуется оценка влияния на налоговую нагрузку и процессы"
    action_risk: Поручить налоговой и юридической службе оценить эффект и сроки вступления в силу
    action_opportunity: Оценить экономию и учесть её в бюджете
    product_risk: {code: guarantee, title: Банковская гарантия для контрактов, needs_feature: CL_PRODUCT_GAR_MARK}
    horizon: 3-12m
  sanctions_trade:
    object: ВЭД-операций
    dir: {up: внешнеторговые ограничения усиливаются, down: внешнеторговые ограничения ослабевают, flat: условия внешней торговли меняются}
    risk: "{dir}; это затрагивает экспортно-импортные операции, платежи и логистику компании"
    opportunity: "{dir}; это открывает возможности для внешнеторговых операций"
    mixed: "{dir}"
    action_risk: Проверить контрагентов и маршруты платежей по ВЭД-контрактам, подготовить альтернативные схемы расчётов
    action_opportunity: Оценить возможность расширения экспортных поставок
    product_risk: {code: ved, title: ВЭД-сопровождение и аккредитивы}
    horizon: 0-3m
  logistics:
    object: логистических издержек
    dir: {up: логистика дорожает или усложняется, down: логистика дешевеет, flat: условия логистики меняются}
    risk: "{dir}; это влияет на сроки и стоимость поставок"
    opportunity: "{dir}; это снижает транспортные издержки"
    mixed: "{dir}"
    action_risk: Пересчитать транспортную составляющую и проверить альтернативные маршруты
    action_opportunity: Перезаключить логистические контракты на лучших условиях
    horizon: 1-3m
  bonds:
    object: стоимости заимствований
    dir: {up: доходности на долговом рынке растут, down: доходности на долговом рынке снижаются, flat: доходности на долговом рынке стабильны}
    risk: "{dir}; это определяет стоимость публичного долга и рефинансирования"
    opportunity: "{dir}; это открывает окно для заимствований или размещения ликвидности"
    mixed: "{dir}"
    action_risk: Сопоставить стоимость облигационного и банковского финансирования перед следующим заимствованием
    action_opportunity: Рассмотреть размещение ликвидности в инструментах с фиксированной доходностью
    horizon: 1-3m
  region:
    object: региональных операций
    dir: {up: в регионе компании происходят значимые изменения, down: в регионе компании ухудшаются условия, flat: в регионе компании происходят изменения}
    risk: "{dir}"
    opportunity: "{dir}"
    mixed: "{dir}; событие касается региона, где зарегистрирована компания"
    action_risk: Оценить влияние на региональные операции и персонал
    action_opportunity: Оценить возможности региональных программ поддержки
    horizon: 1-3m

generic_actions:
  - Сценарный вопрос для команды — что изменится в бюджете, если тренд сохранится ещё 6 месяцев?
