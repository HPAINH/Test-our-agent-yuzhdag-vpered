[project]
name = "elbrus-news-insights"
version = "1.0.0"
description = "Персонализированная новостная аналитика для руководителей крупного бизнеса (Альфа-Будущее Хакатон 2026, команда «Эльбрус»)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pymupdf>=1.24,<2",
    "snowballstemmer>=2.2",
    "pandas>=2.2",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
